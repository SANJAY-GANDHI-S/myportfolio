<section id="projects" class="projects-section" [ngClass]="{ 'padding90px': !isPreview }">
  <div class="container">

    <div class="projects-header">
      <h2 class="section-title">Featured Projects</h2>
      <a routerLink="/projects" class="btn btn-sm view-all" *ngIf="isPreview">View All Projects →</a>
    </div>

    <div class="projects-grid">
      <article class="project-card" *ngFor="let p of projects">
        <div class="project-thumb">
          <img [src]="p.image" [alt]="p.title" *ngIf="p.image != ''"/>
          <p *ngIf="p.image == ''" class="project-title-img">{{p.title}}</p>
          <a [href]="p.link" target="_blank" class="project-link-btn" aria-label="Open project" *ngIf="p.link != ''">
            <svg viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 001.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
              <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
            </svg>
          </a>
        </div>
        <div class="project-body">
          <h3 class="project-title">{{ p.title }}</h3>
          <p class="project-desc">{{ p.description }}</p>
          <div class="project-tags">
            <span class="tag" *ngFor="let t of p.tags">{{ t }}</span>
          </div>
        </div>
      </article>
    </div>

  </div>
</section>

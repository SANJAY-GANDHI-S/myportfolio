<section id="about" class="about-section">
  <div class="container about-grid">

    <!-- Illustration / avatar card -->
    <div class="about-visual">
      <div class="av-card">
        <div class="av-icon">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="24" r="14" stroke="#7c5cfc" stroke-width="3"/>
            <path d="M8 56c0-13.255 10.745-24 24-24s24 10.745 24 24"
                  stroke="#7c5cfc" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Text -->
    <div class="about-text">
      <h2 class="section-title">About Me</h2>
      <p class="about-bio">
        I'm an Angular Developer who loves turning ideas into real-world applications.
        I specialize in building responsive, performance-driven web apps using Angular,
        TypeScript, and modern web technologies.
      </p>

      <div class="stats-row">
        <div class="stat-card" *ngFor="let s of stats">
          <span class="stat-value">{{ s.value }}</span>
          <span class="stat-label">{{ s.label }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
